# Nightly: copy each location's hours from Google Business Profile to the website.
# Edit hours in Google only. If anything changed, this rebuilds the site and pushes;
# Vercel then redeploys. Run it by hand any time: Actions > Sync hours from Google > Run workflow.
name: Sync hours from Google

on:
  schedule:
    - cron: "17 8 * * *"   # every day ~4:17am Eastern (3:17am in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get hours from Google
        id: sync
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python3 scripts/sync_google_hours.py

      - name: Install build tools
        if: steps.sync.outputs.changed == 'true'
        run: |
          pip install -r requirements.txt
          npm install -g terser@5 --silent

      - name: Rebuild pages (images are reused, not re-encoded)
        if: steps.sync.outputs.changed == 'true'
        env:
          SP_REUSE_ASSETS: "1"
        run: |
          python3 build.py
          python3 build.py --staging

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commit as the repo owner so Vercel accepts the deploy.
          owner="${{ github.repository_owner }}"
          id=$(gh api "users/$owner" --jq .id)
          git config user.name "$owner"
          git config user.email "${id}+${owner}@users.noreply.github.com"
          git add data/hours_google.json dist dist-staging
          git commit -F "$RUNNER_TEMP/hours-commit-msg.txt"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Ask Vercel to redeploy (optional backup)
        if: steps.sync.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
